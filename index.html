<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GolfGPS Pro</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="app-container">
        <!-- Top Header -->
        <header class="app-header">
            <h1>🏌️ GolfGPS Pro</h1>
            <span class="status-badge">GPS Ready</span>
        </header>

        <!-- Main Screen Content -->
        <main class="app-content">
            <div class="hero-card">
                <h2>Ready for Your Round?</h2>
                <p>Select a course or tap quick start to begin tracking distances.</p>
                <button class="primary-btn" id="start-round-btn">▶ Start New Round</button>
            </div>

            <!-- Dashboard Stats Preview -->
            <div class="stats-grid">
                <div class="stat-card">
                    <span class="stat-value">18</span>
                    <span class="stat-label">Holes</span>
                </div>
                <div class="stat-card">
                    <span class="stat-value">Par 72</span>
                    <span class="stat-label">Course Standard</span>
                </div>
            </div>
        </main>

        <!-- Bottom Navigation Bar -->
        <nav class="bottom-nav">
            <button class="nav-item active">
                <span class="nav-icon">⛳</span>
                <span class="nav-label">Play</span>
            </button>
            <button class="nav-item">
                <span class="nav-icon">🗺️</span>
                <span class="nav-label">Courses</span>
            </button>
            <button class="nav-item">
                <span class="nav-icon">📊</span>
                <span class="nav-label">Stats</span>
            </button>
            <button class="nav-item">
                <span class="nav-icon">⚙️</span>
                <span class="nav-label">Settings</span>
            </button>
        </nav>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
